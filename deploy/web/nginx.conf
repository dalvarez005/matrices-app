# MatriCalc: landing en / y la app (PWA de Flutter) en /app/.
# Cloudflare pone el HTTPS delante.
# Dominio anterior (antes de llamarse MatriCalc): redirige al nuevo.
server {
    listen 80;
    server_name matrices.quantis.site;
    return 301 https://matricalc.quantis.site$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    # Redirecciones relativas: detrás de Cloudflare se conserva https y el dominio.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Los archivos no llevan hash en el nombre: siempre se revalidan (ETag),
    # así una versión nueva llega al recargar.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Motor gráfico, fuentes e íconos de la app cambian poco: 30 días.
    location ~ ^/app/(canvaskit|assets|icons)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # El service worker siempre se pide de nuevo para detectar versiones nuevas.
    location = /app/sw.js {
        add_header Cache-Control "no-cache, no-store" always;
        try_files $uri =404;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Landing: /subir sirve subir.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
