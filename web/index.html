<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Suma y resta de matrices, también desde una foto.">
  <meta name="theme-color" content="#4F46E5">

  <!-- iPhone: "Compartir > Agregar a inicio" la abre a pantalla completa. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black" y no "black-translucent": con la barra translúcida iOS calcula
       los toques corridos. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Matrices">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Matrices</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://matricesapi.quantis.site" crossorigin>
  <style>
    /* Pantalla de carga mientras arranca la app. */
    html, body { margin: 0; height: 100%; background: #4F46E5; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Matrices"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
      document.body.style.background = '';
      // Sin zoom: en iPhone, al tocar un campo Safari agranda la página y no
      // la devuelve, y desde ahí los toques caen corridos.
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta) {
        meta.setAttribute('content',
          'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
